name: Deploy frontend (FTPS)

# Builds the React app and uploads frontend/build to the cPanel host (portal.koderkids.pk).
# Required repository secrets: FTP_USERNAME, FTP_PASSWORD
# FTP host: cPanel shows ftp.1clickestore.com but that name has no DNS record;
# ftp.koderkids.pk resolves to the same Pure-FTPd server (162.55.88.225).
# The FTP account is locked to the site folder (/home/clickest/portal.koderkids.pk),
# so the server-dir below is its root.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a half-finished upload
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # CRA treats ESLint warnings as errors when CI=true; this codebase has many warnings
          CI: 'false'
        run: npm run build

      - name: Upload to server (explicit FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.koderkids.pk
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: frontend/build/
          server-dir: ./
          # Only files this action uploaded earlier are ever deleted; pre-existing
          # server files (e.g. .htaccess) are left alone.
